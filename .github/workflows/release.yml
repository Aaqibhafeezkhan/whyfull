name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches the version in the code
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import whyfull; print(whyfull.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but code says $version"; exit 1; }
      - run: pip install build
      - run: python -m build
      - run: python tools/build_pyz.py && python dist/whyfull.pyz --version
      - name: Split PyPI files from release-only files
        run: |
          mkdir pyz && mv dist/whyfull.pyz pyz/
          (cd dist && sha256sum * ../pyz/whyfull.pyz | sed 's#\.\./pyz/##') > pyz/SHA256SUMS
          cat pyz/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pyz
          path: pyz/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # PyPI trusted publishing: no token is stored in the repository.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
